<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Review — Forge Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Forge Digital</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </div>
        <a href="#" class="nav-auth">Login / Sign Up</a>
    </nav>

    <section id="submit-review-section">
        <div id="login-required" style="display: none;">
            <h2>Please log in to leave a review</h2>
            <p>You need an account to submit a review.</p>
        </div>

        <div id="review-form-wrapper" style="display: none;">
            <h2>Share Your Experience</h2>
            <form id="review-form">
                <div>
                    <label>Rating (1-5)</label>
                    <input type="number" id="rating" min="1" max="5" required>
                </div>
                <div>
                    <label>Comment</label>
                    <textarea id="comment" required></textarea>
                </div>
                <button type="submit">Submit Review</button>
            </form>
            <p id="review-status"></p>
        </div>
    </section>

    <!-- Firebase SDK (CDN) -->
    <script type="module" src="submit-review.js"></script>
</body>
</html>
